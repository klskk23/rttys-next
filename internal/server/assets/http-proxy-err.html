<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>RTTY</title>
    <style>
        :root {
            --surface: #f6fafe;
            --on-surface: #181c20;
            --error-container: #ffdad6;
            --on-error-container: #93000a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #101417;
                --on-surface: #dfe3e7;
                --error-container: #93000a;
                --on-error-container: #ffdad6;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: var(--surface);
            color: var(--on-surface);
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .icon {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--error-container);
        }

        .icon svg {
            width: 48px;
            height: 48px;
            fill: var(--on-error-container);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="icon">
        <svg viewBox="0 0 24 24">
            <path d="M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z"/>
        </svg>
    </div>
    <h1 id="errorTitle"></h1>

    <script>
        const translations = {
            en: {
                offline: 'Device offline',
                unauthorized: 'Unauthorized'
            },
            'zh-CN': {
                offline: '设备离线',
                unauthorized: '未授权访问'
            }
        };

        const errorType = '{{.}}';
        const lang = navigator.language.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
        const title = translations[lang][errorType] || translations.en[errorType] || 'Error';

        document.documentElement.lang = lang;
        document.getElementById('errorTitle').textContent = title;
        document.title = title + ' - RTTY';
    </script>
</body>
</html>
