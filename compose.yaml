services:
  rttys:
    image: ghcr.io/klskk23/rttys-next:${RTTYS_VERSION:-latest}
    container_name: rttys
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    command:
      - --log-level=${RTTYS_LOG_LEVEL:-info}
      - --password=${RTTYS_PASSWORD:?set RTTYS_PASSWORD in .env}
      - --token=${RTTYS_TOKEN:-}
      - --allow-origins=${RTTYS_ALLOW_ORIGINS:-false}
      - --dev-hook-url=${RTTYS_DEV_HOOK_URL:-}
      - --user-hook-url=${RTTYS_USER_HOOK_URL:-}
      - --addr-http-proxy=:${RTTYS_HTTP_PROXY_PORT:-5914}
      - --http-proxy-redir-url=${RTTYS_HTTP_PROXY_REDIR_URL:-}
      - --http-proxy-redir-domain=${RTTYS_HTTP_PROXY_REDIR_DOMAIN:-}
      - --share-public-host=${RTTYS_SHARE_PUBLIC_HOST:-}
      - --share-port-start=${RTTYS_SHARE_PORT_START:-20000}
      - --share-port-end=${RTTYS_SHARE_PORT_END:-20099}
      - --share-host-key=/var/lib/rttys/ssh_host_ed25519_key
      - --sslcert=${RTTYS_SSL_CERT:-}
      - --sslkey=${RTTYS_SSL_KEY:-}
      - --cacert=${RTTYS_CA_CERT:-}
    ports:
      - "${RTTYS_DEV_PORT:-5912}:5912"
      - "${RTTYS_WEB_PORT:-5913}:5913"
      # The proxy redirect embeds the listen port, so host and container ports must match.
      - "${RTTYS_HTTP_PROXY_PORT:-5914}:${RTTYS_HTTP_PROXY_PORT:-5914}"
      - "${RTTYS_SHARE_PORT_START:-20000}-${RTTYS_SHARE_PORT_END:-20099}:${RTTYS_SHARE_PORT_START:-20000}-${RTTYS_SHARE_PORT_END:-20099}"
    volumes:
      - rttys-data:/var/lib/rttys
      - ${RTTYS_CERT_DIR:-./certs}:/etc/rttys/certs:ro
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  rttys-data:
